apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rmblau-default
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: development
spec:
  project: default
  source:
    path: deploys
    repoURL: https://github.com/rmblau/argocd
    targetRevision: main
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
