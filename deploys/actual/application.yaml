apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actualbudget
  namespace: argocd
  labels:
    app.kubernetes.io/name: actualbudget
spec:
  project: default
  sources:
    - repoURL: https://community-charts.github.io/helm-charts
      chart: actualbudget
      targetRevision: 1.9.5
      helm:
        releaseName: actualbudget
        values: |
          fullnameOverride: actualbudget
          persistence:
            enabled: true
            size: 10Gi
          ingress:
            enabled: false
          image:
            repository: actualbudget/actualbudget
            tag: 26.11.0
  destination:
    server: https://kubernetes.default.svc
    namespace: actualbudget
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
